<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a6ff" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.22" />

  <!-- Pinstripes -->
  <g stroke="#ffffff" stroke-width="4" opacity="0.08" stroke-linecap="round">
    <line x1="-40" y1="50" x2="120" y2="-110" />
    <line x1="5" y1="95" x2="165" y2="-65" />
    <line x1="50" y1="140" x2="210" y2="-20" />
    <line x1="95" y1="185" x2="255" y2="25" />
    <line x1="140" y1="230" x2="300" y2="70" />
    <line x1="185" y1="275" x2="345" y2="115" />
    <line x1="230" y1="320" x2="390" y2="160" />
    <line x1="275" y1="365" x2="435" y2="205" />
    <line x1="320" y1="410" x2="480" y2="250" />
  </g>

  <!-- Monogram -->
  <g filter="url(#shadow)">
    <!-- 'W' -->
    <path d="M 88 172 L 138 348 C 142 358 152 364 163 364 C 174 364 183 358 187 348 L 224 236 L 261 348 C 265 358 274 364 285 364 C 296 364 305 358 309 348 L 334 252" 
          fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 'P' Spine -->
    <path d="M 334 172 L 334 354" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />

    <!-- 'P' Loop -->
    <path d="M 334 172 L 402 172 L 434 204 L 434 238 C 434 254 422 268 406 272 L 334 272" 
          fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Origami Fold -->
    <path d="M 402 158 L 448 204 L 402 204 Z" fill="#93c5fd" />
  </g>
</svg>